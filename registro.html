<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Sistema Educativo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(255, 193, 7, 0.1);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #FFC107, #FF9800);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #000;
            font-weight: bold;
        }

        h1 {
            color: #FFC107;
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: #FFCC80;
            font-size: 14px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            color: #FFCC80;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 193, 7, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus {
            outline: none;
            border-color: #FFC107;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.3);
            transform: translateY(-2px);
        }

        .role-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .role-btn {
            padding: 15px 20px;
            border: 2px solid rgba(255, 193, 7, 0.5);
            background: rgba(255, 193, 7, 0.1);
            color: #FFC107;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .role-btn:hover {
            background: linear-gradient(45deg, #FFC107, #FF9800);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 193, 7, 0.4);
        }

        .role-btn.active {
            background: linear-gradient(45deg, #FFC107, #FF9800);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
        }

        .register-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #FFC107, #FF9800);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 193, 7, 0.5);
        }

        .register-btn:active {
            transform: translateY(-1px);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #FFCC80;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            color: #FFC107;
            text-decoration: underline;
        }

        .icon {
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .role-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎓</div>
            <h1>Registro</h1>
            <p class="subtitle">Crea tu cuenta en el sistema educativo</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre completo" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Selecciona tu rol:</label>
                <div class="role-buttons">
                    <button type="button" class="role-btn active" data-role="estudiante">
                        <span class="icon">👨‍🎓</span>Estudiante
                    </button>
                    <button type="button" class="role-btn" data-role="profesor">
                        <span class="icon">👨‍🏫</span>Profesor
                    </button>
                    <button type="button" class="role-btn" data-role="bibliotecario">
                        <span class="icon">📚</span>Bibliotecario
                    </button>
                </div>
            </div>

            <button type="submit" class="register-btn">
                Crear Cuenta
            </button>
        </form>

        <div class="login-link">
            ¿Ya tienes cuenta? <a href="#">Inicia sesión</a>
        </div>
    </div>

    <script>
        // Funcionalidad para los botones de rol
        const roleButtons = document.querySelectorAll('.role-btn');
        const form = document.getElementById('registerForm');

        roleButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                roleButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Manejo del formulario
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const activeRoleBtn = document.querySelector('.role-btn.active');
            const role = activeRoleBtn ? activeRoleBtn.dataset.role : '';
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (nombre && email && password && role) {
                alert(`¡Registro exitoso!\n\nNombre: ${nombre}\nEmail: ${email}\nRol: ${role.charAt(0).toUpperCase() + role.slice(1)}`);
                form.reset();
                roleButtons[0].classList.add('active');
                roleButtons.forEach((btn, index) => {
                    if (index !== 0) btn.classList.remove('active');
                });
            }
        });
    </script>
</body>
</html>
